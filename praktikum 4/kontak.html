<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tambahan styling kecil khusus form agar rapi -->
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }
        .form-group textarea {
            height: 120px;
        }
        .btn-submit {
            background-color: #1f5faa;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #2b83ea;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Header -->
        <header>
            <h1>Layout Sederhana</h1>
        </header>

        <!-- Navigasi (Aktif di menu Kontak) -->
        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <!-- Wrapper Konten & Sidebar -->
        <div id="wrapper">
            <section id="main">
                <article class="entry">
                    <h2>Hubungi Kami</h2>
                    <p>Silakan isi formulir di bawah ini jika ada pertanyaan atau pesan yang ingin disampaikan.</p>
                    
                    <form action="#" method="POST" style="margin-top: 20px;">
                        <div class="form-group">
                            <label for="nama">Nama Lengkap:</label>
                            <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda..." required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="Masukkan email Anda..." required>
                        </div>

                        <div class="form-group">
                            <label for="pesan">Pesan / Message:</label>
                            <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
                        </div>

                        <button type="submit" class="btn-submit">Kirim Pesan</button>
                    </form>
                </article>
            </section>

            <!-- Sidebar -->
            <aside id="sidebar">
                <div class="widget-box">
                    <h3 class="title">Info Kontak</h3>
                    <p><strong>Alamat:</strong><br>Bekasi, Jawa Barat</p>
                    <p><strong>Email:</strong><br>info@pelitabangsa.ac.id</p>
                </div>
            </aside>
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 - Universitas Pelita Bangsa</p>
        </footer>
    </div>
</body>
</html>
